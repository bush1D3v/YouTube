services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: finance-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: file:/app/prisma/dev.db
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - api-data:/app/prisma
    ports:
      - "3333:3333"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3333
    container_name: finance-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3333
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  api-data:
